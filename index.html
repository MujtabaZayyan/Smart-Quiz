<head>
  <meta
    name="google-site-verification" content="zgw0o27zdBJJoli8CvLkrSiD8RIwDVjAteo4SH157q4" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Smart Quiz for Smart People — play fun football, general knowledge and self-management quizzes online. Test your knowledge, beat the timer and share your score.">

<meta name="keywords" content="online quiz, football quiz, general knowledge quiz, GK quiz, self management quiz, fun quiz, quiz game">

<title>Smart Quiz – Football, GK & Self Management Quiz</title>

<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07111f;color:#eef6ff}
header{padding:24px 18px;text-align:center;background:linear-gradient(180deg,#10243d,#07111f);border-bottom:1px solid #29435f}
.satellite{font-size:50px}h1{margin:6px 0;font-size:clamp(27px,6vw,44px)}.tag{color:#a9c4df}
.container{max-width:850px;margin:auto;padding:24px 18px}.screen{display:none}.screen.active{display:block}
.card{background:#0d1d31;border:1px solid #29435f;border-radius:20px;padding:24px;box-shadow:0 10px 30px #0004}
h2{margin-top:0}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-top:20px}
button{width:100%;border:0;border-radius:14px;padding:15px;margin-top:12px;background:#1e8fff;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}.category{min-height:130px;text-align:left}.football{background:#146b45}.general{background:#2456a6}.self{background:#8b5a16}
.progress{height:9px;background:#1a2b40;border-radius:20px;overflow:hidden;margin:12px 0 18px}.bar{height:100%;width:0;background:#45b6ff;transition:.2s}
.timerrow{display:flex;align-items:center;justify-content:space-between;gap:14px}.timer{font-size:28px;font-weight:bold;min-width:74px;text-align:right}.timer.warning{color:#ffcf4a}.timer.danger{color:#ff6875}
.option{background:#162a42;text-align:left}.option.correct{background:#167548}.option.wrong{background:#a63b45}.option:disabled{cursor:default}
.score{font-size:54px;font-weight:bold;text-align:center}.center{text-align:center}.small{color:#a9c4df}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.back{background:#263b52;width:auto;padding:9px 15px;margin:0}
.share{background:#7b5cff}.notice{min-height:22px;color:#a9c4df;margin-top:12px}footer{text-align:center;padding:30px;color:#7590aa}
</style>
</head>
<body>
<header><div class="satellite">🛰️</div><h1>Smart Quiz for Smart People</h1><div class="tag">Test your knowledge. Improve yourself. Challenge your friends.</div></header>
<main class="container">
<section id="home" class="screen active"><div class="card">
<h2>Choose your quiz 🚀</h2><p class="small">10 questions • 7.7 seconds per question • Instant results</p>
<div class="categories">
<button class="category football" onclick="startQuiz('Football')">⚽ Football<br><span class="small">Players, clubs & football facts</span></button>
<button class="category general" onclick="startQuiz('General Knowledge')">🌍 General Knowledge<br><span class="small">World, science & everyday facts</span></button>
<button class="category self" onclick="startQuiz('Self Management')">🧠 Self Management<br><span class="small">Habits, focus & time management</span></button>
</div></div></section>

<section id="quiz" class="screen"><div class="card">
<div class="top"><span id="categoryTitle"></span><button class="back" onclick="goHome()">Exit</button></div>
<div class="timerrow"><span id="questionNumber" class="small"></span><div id="timer" class="timer">7.7s</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<h2 id="question"></h2><div id="options"></div>
<button id="next" onclick="nextQuestion()" style="display:none">Next Question →</button>
</div></section>

<section id="result" class="screen"><div class="card center">
<h2>Quiz Complete! 🎉</h2><div class="score" id="score"></div><p id="message"></p>
<button class="share" onclick="shareScore()">📤 Share My Score</button>
<div id="notice" class="notice" aria-live="polite"></div>
<button onclick="restart()">Play Again</button><button onclick="goHome()">Choose Another Quiz</button>
</div></section>
</main>
<footer>🛰️ Smart Quiz for Smart People</footer>
<script>
const quizzes={
Football:[
["Who won the FIFA World Cup in 2022?",["France","Argentina","Brazil","Germany"],1],["Which club is nicknamed the Red Devils?",["Liverpool","Arsenal","Manchester United","Chelsea"],2],["How many players does one football team normally have on the pitch?",["9","10","11","12"],2],["Who is known as the Egyptian King?",["Mohamed Salah","Sadio Mane","Riyad Mahrez","Hakim Ziyech"],0],["Which country has won the most FIFA World Cups?",["Germany","Brazil","Italy","Argentina"],1],["Which position usually wears gloves?",["Defender","Goalkeeper","Midfielder","Striker"],1],["What is a hat-trick in football?",["Three assists","Three goals by one player","Three saves","Three yellow cards"],1],["Which tournament is played between European national teams?",["Copa America","AFCON","UEFA European Championship","AFC Asian Cup"],2],["How long is a standard football match, excluding added time?",["80 minutes","90 minutes","100 minutes","120 minutes"],1],["What card means a player is sent off?",["Blue","Green","Yellow","Red"],3]],
"General Knowledge":[
["What is the capital of India?",["Mumbai","New Delhi","Kolkata","Chennai"],1],["Which planet is known as the Red Planet?",["Venus","Mars","Jupiter","Mercury"],1],["How many continents are there?",["5","6","7","8"],2],["What is H2O commonly called?",["Oxygen","Hydrogen","Water","Salt"],2],["Which is the largest ocean?",["Atlantic","Indian","Pacific","Arctic"],2],["What is the fastest land animal?",["Lion","Cheetah","Horse","Tiger"],1],["How many days are there in a leap year?",["365","366","364","360"],1],["Which gas do plants mainly absorb for photosynthesis?",["Oxygen","Nitrogen","Carbon dioxide","Helium"],2],["What is the largest mammal?",["Elephant","Blue whale","Giraffe","Hippopotamus"],1],["Which instrument measures temperature?",["Barometer","Thermometer","Compass","Hygrometer"],1]],
"Self Management":[
["What is a useful first step when setting a goal?",["Make it vague","Define a clear target","Ignore deadlines","Wait for motivation"],1],["Which habit can help reduce distractions while studying?",["Constant notifications","Focused study sessions","Multitasking","Frequent social media checks"],1],["What does prioritizing mean?",["Doing everything at once","Choosing what needs attention first","Avoiding tasks","Working without a plan"],1],["Which is a good way to manage a large task?",["Break it into smaller steps","Never start","Do it randomly","Add more tasks"],0],["Why can a to-do list be useful?",["It removes all work","It helps organize tasks","It guarantees success","It replaces sleep"],1],["Which habit supports healthy productivity?",["Regular breaks","Skipping all breaks","Sleeping less","Constant multitasking"],0],["What is procrastination?",["Planning early","Delaying a task unnecessarily","Finishing early","Taking a short break"],1],["Which approach can help build a new habit?",["Start with a small repeatable action","Change everything overnight","Give up after one mistake","Avoid reminders"],0],["What should you do after making a mistake?",["Learn from it and adjust","Never try again","Hide it","Blame someone"],0],["Which skill helps you protect time for important work?",["Time management","Guessing","Distraction","Avoidance"],0]]
};
const TIME=7.7;let current=[],index=0,points=0,category="",timerId=null,endAt=0,answered=false;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");window.scrollTo(0,0)}
function startQuiz(cat){clearInterval(timerId);category=cat;current=quizzes[cat];index=0;points=0;$("categoryTitle").textContent=cat;show("quiz");render()}
function render(){answered=false;let q=current[index];$("questionNumber").textContent=`Question ${index+1} of ${current.length}`;$("question").textContent=q[0];$("bar").style.width=((index)/current.length*100)+"%";let box=$("options");box.innerHTML="";
q[1].forEach((opt,i)=>{let b=document.createElement("button");b.className="option";b.textContent=opt;b.onclick=()=>answer(i,b);box.appendChild(b)});$("next").style.display="none";startTimer()}
function startTimer(){clearInterval(timerId);endAt=performance.now()+TIME*1000;updateTimer();timerId=setInterval(updateTimer,50)}
function updateTimer(){let left=Math.max(0,(endAt-performance.now())/1000);$("timer").textContent=left.toFixed(1)+"s";$("timer").className="timer"+(left<=2?" danger":left<=4?" warning":"");if(left<=0){clearInterval(timerId);if(!answered)timeUp()}}
function answer(choice,clicked){if(answered)return;answered=true;clearInterval(timerId);let q=current[index];document.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;if(i===q[2])b.classList.add("correct")});if(choice!==q[2])clicked.classList.add("wrong");else points++;$("bar").style.width=((index+1)/current.length*100)+"%";$("next").style.display="block";$("timer").textContent="Done"}
function timeUp(){answered=true;document.querySelectorAll(".option").forEach((b,i)=>{b.disabled=true;if(i===current[index][2])b.classList.add("correct")});$("bar").style.width=((index+1)/current.length*100)+"%";$("timer").textContent="0.0s";$("next").style.display="block"}
function nextQuestion(){clearInterval(timerId);index++;if(index<current.length)render();else finish()}
function finish(){clearInterval(timerId);let pct=Math.round(points/current.length*100);$("score").textContent=`${points}/${current.length}`;$("message").textContent=pct>=80?"Excellent! 🚀":pct>=50?"Good job! Keep improving! 💪":"Keep practicing — you can do it! 🌟";$("notice").textContent="";show("result")}
async function shareScore(){
  let pct=Math.round(points/current.length*100);
  let resultUrl=location.origin+location.pathname+
    "?category="+encodeURIComponent(category)+
    "&score="+points+
    "&total="+current.length;

  let text=`I scored ${points}/${current.length} (${pct}%) in ${category} on Smart Quiz for Smart People! 🛰️ Can you beat my score?`;

  try{
    if(navigator.share){
      await navigator.share({
        title:"Smart Quiz for Smart People",
        text:text,
        url:resultUrl
      });
      $("notice").textContent="Share sheet opened!";
    }else if(navigator.clipboard){
      await navigator.clipboard.writeText(text+" "+resultUrl);
      $("notice").textContent="Score link copied — paste it into WhatsApp or Instagram.";
    }else{
      $("notice").textContent=text+" "+resultUrl;
    }
  }catch(e){
    if(e.name!=="AbortError") $("notice").textContent=text;
  }
}
function restart(){startQuiz(category)}function goHome(){clearInterval(timerId);show("home")}
</script>
</body></html>
